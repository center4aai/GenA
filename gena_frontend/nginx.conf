# Self-signed cert is generated at image build for local/CI only.
# For teacher-facing deploy, terminate TLS with a valid certificate
# (Let's Encrypt) in front of this container — see docs/TEACHER_DEPLOY.md.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 50m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /api/dataset/metrics { return 403; }
    location = /api/dataset/tasks/claim { return 403; }
    location = /api/dataset/tasks/stuck { return 403; }
    location ~ ^/api/dataset/tasks/.+/status$ { return 403; }
    location = /api/dataset/datasets/reconcile-status { return 403; }
    location ~ ^/api/dataset/datasets/.+/chunks/.+/gate$ { return 403; }
    location ~ ^/api/dataset/datasets/.+/gate-progress$ { return 403; }
    # Quality revalidation: claim / heartbeat / result are worker-only.
    location = /api/dataset/revalidation/claim { return 403; }
    location ~ ^/api/dataset/revalidation/items/.+/heartbeat$ { return 403; }
    location ~ ^/api/dataset/revalidation/items/.+$ { return 403; }
    # Документ: скачивание (GET) — только для воркера по внутренней сети,
    # но загрузка (POST) нужна фронтенду при каждом новом прогоне.
    location ~ ^/api/dataset/datasets/.+/document$ {
        if ($request_method ~ ^(GET|HEAD)$) { return 403; }
        set $dataset_upstream dataset_api;
        rewrite ^/api/dataset/(.*)$ /$1 break;
        proxy_pass http://$dataset_upstream:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Намеренно без `^~`: он отключил бы проверку regex-локаций выше
    # (worker-only 403 и /document). Статика ниже объявлена prefix-локацией
    # `^~ /assets/`, поэтому regex, способных перехватить /api/, в конфиге нет.
    location /api/dataset/ {
        set $dataset_upstream dataset_api;
        rewrite ^/api/dataset/(.*)$ /$1 break;
        proxy_pass http://$dataset_upstream:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # agent_api не имеет аутентификации, поэтому наружу проксируются только
    # пути, которые вызывает UI (gena_frontend/src/shared/api/agent.ts).
    # Всё остальное под /api/agent/ (process_prompt, chunk_gate, health,
    # models/discover) — только для воркера по внутренней сети.
    location = /api/agent/models/ {
        set $agent_upstream agent_api;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass http://$agent_upstream:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/agent/models/health/ {
        set $agent_upstream agent_api;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass http://$agent_upstream:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/agent/rephrase_questions/ {
        set $agent_upstream agent_api;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass http://$agent_upstream:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /api/agent/ { return 403; }

    # Любой другой /api/... (в т.ч. бывший /api/chunker/) — 404, а не SPA-fallback.
    location ^~ /api/ { return 404; }

    # Точка входа SPA (сюда же приходит внутренний редирект из try_files):
    # браузер обязан перепроверять её при каждой загрузке, иначе после деплоя
    # он будет ссылаться на уже удалённые хэшированные ассеты.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Только хэшированные сборки Vite (dist/assets/*-<hash>.js). Нехэшированные
    # /logo.png, /favicon.svg и т.п. сюда не попадают.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
